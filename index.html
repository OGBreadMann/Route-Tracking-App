<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pinky's Route Tracker</title>
  <meta name="description" content="Track the trash route, log stops, and find the fastest order.">
  <meta name="theme-color" content="#e2337f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Route Tracker">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">P</span> Pinky's Route Tracker</div>
  </header>
  <main id="view"></main>
  <nav class="tabs">
    <button data-tab="track" class="active"><span>📍</span>Track</button>
    <button data-tab="routes"><span>🗺️</span>Routes</button>
    <button data-tab="settings"><span>⚙️</span>Settings</button>
  </nav>
  <div id="toast" role="status"></div>
  <div id="sheet-root"></div>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
